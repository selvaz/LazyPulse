name: boundary

# Enforces the lazybridge public-surface boundary: shipped LazyPulse source
# may only import ``lazybridge`` top-level and ``lazybridge.ext.*`` (never
# lazybridge's private internals). Importing the ``lazytools`` sibling is
# allowed and not policed here.

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # lazytoolkit is not on PyPI (kept private); install the sibling from
          # the public LazyTools repo, pinned to an immutable commit so CI is
          # reproducible. Bump the SHA when you need newer LazyTools; drop this
          # line once lazytoolkit ships to PyPI.
          pip install "lazytoolkit @ git+https://github.com/selvaz/LazyTools.git@d00da975969678dae69958e4c2053c39fc2863dc"
          pip install -e ".[dev]"
      - name: Static private-import check
        run: pytest tests/unit/test_no_private_imports.py -q
