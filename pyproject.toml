[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazypulse"
version = "0.3.2"
description = "Always-on agents: a tick loop, a trust policy, and inbound adapters on top of lazybridge."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "selvaz" }]
keywords = ["llm", "agents", "automation", "gmail", "telegram", "webhook", "lazybridge", "human-in-the-loop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "lazybridge>=1.0.1,<2.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
# NOTE: the gmail/outlook/telegram extras depend on ``lazytoolkit`` (where the
# extracted clients/tools live). Distribution model: only LazyBridge is on
# PyPI; lazytoolkit ships exclusively from GitHub at an immutable release tag.
# The tag below is the single source for every workflow too — it is governed
# by LazyTools' ecosystem/compatibility.toml and only changes via a PR that
# updates that manifest.
# HTTP intake adapter (WebhookAdapter). Kept optional so the core install
# stays dependency-light for users who only poll Gmail or use custom adapters.
webhook = ["starlette>=0.37,<1.0", "uvicorn>=0.29,<1.0"]
# Gmail polling inbox + the extracted client/tools.
gmail = ["lazytoolkit[gmail] @ git+https://github.com/selvaz/LazyTools.git@v0.5.0"]
# Local Outlook desktop inbox + the extracted client/tools (Windows/COM).
outlook = ["lazytoolkit[outlook] @ git+https://github.com/selvaz/LazyTools.git@v0.5.0"]
# Telegram polling inbox + the extracted client/tool.
telegram = ["lazytoolkit[telegram] @ git+https://github.com/selvaz/LazyTools.git@v0.5.0"]
# Cron-expression based scheduling (CronTrigger / schedule_cron).
cron = ["croniter>=1.3,<2.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "httpx>=0.27,<1.0",
    "starlette>=0.37,<1.0",
    "lazytoolkit @ git+https://github.com/selvaz/LazyTools.git@v0.5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "croniter>=1.3,<2.0",
]
# Documentation-site build (mkdocs → GitHub Pages).
site = ["mkdocs-material>=9.5,<10.0", "mkdocs-llmstxt>=0.3,<1.0", "pymdown-extensions>=10.0,<11.0"]

[project.urls]
Homepage = "https://github.com/selvaz/LazyPulse"
Repository = "https://github.com/selvaz/LazyPulse"
Changelog = "https://github.com/selvaz/LazyPulse/blob/main/CHANGELOG.md"
Issues = "https://github.com/selvaz/LazyPulse/issues"

[tool.hatch.metadata]
# Direct references are part of the distribution model: only LazyBridge lives
# on PyPI; lazytoolkit (and lazypulse itself) install from GitHub at immutable
# release tags (see LazyTools' ecosystem/compatibility.toml).
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/lazypulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E402",
    "E501",
    "B008",   # pydantic Field(default_factory=...) in defaults
    "RUF012", # mutable class attr annotations (pydantic models)
    "SIM105", # try/except/pass reads clearer than contextlib.suppress here
    "RUF002", # ambiguous unicode (× in docstrings) is intentional
    "RUF022", # __all__ grouped by category, not alphabetically sorted
]

[tool.ruff.lint.isort]
known-first-party = ["lazypulse"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
