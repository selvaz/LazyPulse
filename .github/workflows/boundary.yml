name: boundary

# Enforces the lazybridge public-surface boundary: shipped LazyPulse source
# may only import ``lazybridge`` top-level and ``lazybridge.ext.*``.

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Static private-import check
        run: pytest tests/unit/test_no_private_imports.py -q
