name: test

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # lazytoolkit is not on PyPI (kept private); install the sibling from
          # the public LazyTools repo (main). Swap for a PyPI release once published.
          pip install "lazytoolkit @ git+https://github.com/selvaz/LazyTools.git@main"
          pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # lazytoolkit is not on PyPI (kept private); install the sibling from
          # the public LazyTools repo (main). Swap for a PyPI release once published.
          pip install "lazytoolkit @ git+https://github.com/selvaz/LazyTools.git@main"
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src/lazypulse
