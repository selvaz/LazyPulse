[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazypulse"
version = "0.1.0"
description = "Always-on agents: a tick loop, a trust policy, and inbound adapters on top of lazybridge."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "selvaz" }]
keywords = ["llm", "agents", "automation", "gmail", "webhook", "lazybridge", "human-in-the-loop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "lazybridge>=0.7.9,<0.8",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
# HTTP intake adapter (WebhookAdapter). Kept optional so the core install
# stays dependency-light for users who only poll Gmail or use custom adapters.
webhook = ["starlette>=0.37,<1.0", "uvicorn>=0.29,<1.0"]
# Gmail polling + draft/send tools. Pulls the Google client libraries; kept
# in extras so ``pip install lazypulse`` never downloads them.
gmail = [
    "google-api-python-client>=2.0,<3.0",
    "google-auth>=2.0,<3.0",
    "google-auth-oauthlib>=1.0,<2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "httpx>=0.27,<1.0",
    "starlette>=0.37,<1.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/selvaz/LazyPulse"
Repository = "https://github.com/selvaz/LazyPulse"

[tool.hatch.build.targets.wheel]
packages = ["src/lazypulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E402",
    "E501",
    "B008",   # pydantic Field(default_factory=...) in defaults
    "RUF012", # mutable class attr annotations (pydantic models)
    "SIM105", # try/except/pass reads clearer than contextlib.suppress here
    "RUF002", # ambiguous unicode (× in docstrings) is intentional
    "RUF022", # __all__ grouped by category, not alphabetically sorted
]

[tool.ruff.lint.isort]
known-first-party = ["lazypulse"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
