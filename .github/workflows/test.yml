name: test

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The dev extra pins lazytoolkit to the same immutable release tag
          # users get — CI must not pre-install a different revision.
          pip install -e ".[dev]"
      - name: Pytest
        # Enforce a coverage floor (current coverage ~91%; floor set just below
        # to catch regressions without churn). Raise as coverage improves.
        run: pytest -q --cov=lazypulse --cov-report=term-missing --cov-fail-under=88

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The dev extra pins lazytoolkit to the same immutable release tag
          # users get — CI must not pre-install a different revision.
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src/lazypulse
